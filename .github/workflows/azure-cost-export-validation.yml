name: Azure Cost Export Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-cost-export-validation
  cancel-in-progress: false

jobs:
  validate-export:
    name: Validate latest Azure cost export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AZURE_STORAGE_ACCOUNT_URL: https://finops7ae702da4d24.blob.core.windows.net/
      AZURE_STORAGE_CONTAINER: cost-exports
      AZURE_EXPORT_PREFIX: daily/finops-daily-cost-export/
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run project tests
        run: python -m pytest -v

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate latest Azure export
        id: validation
        shell: bash
        run: |
          set +e
          python -m finops.validate_azure_export \
            --max-age-hours 48 > validation-result.json
          rc=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("validation-result.json").read_text(encoding="utf-8")
          )

          # Publish only operational metadata, never billing rows or totals.
          print("Validation status:", result.get("status", "unknown"))
          print("Source:", result.get("source", "unknown"))
          print("Record count:", result.get("record_count", "not available"))
          print("Export age hours:", result.get("export_age_hours", "not available"))

          if result.get("status") != "valid":
              error = result.get("error", "Validation failed")
              print("Validation detail:", error[:500])
              raise SystemExit(1)
          PY

          validation_rc=$?
          rm -f validation-result.json
          exit "$validation_rc"

      - name: Sign out of Azure
        if: always()
        run: az logout
